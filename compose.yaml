services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ai_job_match_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - job_match_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_job_match_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  job_match_data:
